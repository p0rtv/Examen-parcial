services:
  postgres:
    image: postgres:16-alpine
    container_name: campuseats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campuseatsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5433:5432"
    volumes:
      - campuseats_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campuseatsdb"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  campuseats_postgres_data:
